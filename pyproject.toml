[project]
name = "plantcv-mcp"
version = "1.15.0"
description = "MCP server exposing PlantCV as a measurement instrument — traits plus the segmentation overlay they came from"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jaret Arnold" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "plantcv",
    "phenotyping",
    "plant-science",
    "image-analysis",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # 2.x only. The old 1.28.1 floor was a SECURITY floor rather than a feature
    # one, and every 2.x release clears it. The range MOVES rather than widening
    # to <3: this package imports mcp.server.mcpserver, which does not exist in
    # 1.x, so a range spanning both majors could resolve to a version that cannot
    # import the server. mcp 2.x requires Python >=3.10, below our >=3.11 floor.
    "mcp>=2,<3",
    # Hard pin, deliberately. Trait values can shift between PlantCV releases, and
    # PlantCV-version stability is a tested design goal (tests/test_determinism.py)
    # surfaced to callers by list_methods() and by the `engine` field on every
    # result. It is version stability, not bit-for-bit reproducibility: `uvx
    # plantcv-mcp` does not consume this repository's uv.lock, so OpenCV, NumPy
    # and mcp may still vary within their bounds. Re-pin explicitly when
    # validating a new PlantCV release.
    "plantcv==4.11.3",
    # No upper bound here on purpose: plantcv already caps opencv-python at <=4.12,
    # and duplicating that ceiling would silently drift when plantcv raises it.
    # NOTE: plantcv requires non-headless opencv-python, so switching this to
    # opencv-python-headless would NOT yield a headless install.
    "opencv-python>=4.9",
    "numpy>=1.26",
    # Declared explicitly rather than leaned on as a pydantic transitive: our
    # outputSchema TypedDicts MUST come from typing_extensions, because pydantic
    # raises PydanticUserError on typing.TypedDict under Python < 3.12.
    "typing-extensions>=4.12",
    # Imported directly (contracts.py closes every output TypedDict with
    # pydantic.with_config), so declared rather than leaned on through mcp.
    "pydantic>=2.11",
]

[project.optional-dependencies]
# segment_leaves_sam() only. NOT installed by default and not needed by any
# other tool: torch is ~200 MB of CPU wheels. The server imports and runs
# without it, and the tool then refuses with the install command.
# segment-anything is pinned because its mask generator's behaviour is what
# docs/EVAL.md measured; torchvision is its undeclared dependency (batched NMS).
sam = ["segment-anything==1.0", "torch>=2.4", "torchvision>=0.19"]

[project.urls]
Homepage = "https://github.com/musharna/plantcv-mcp"
Repository = "https://github.com/musharna/plantcv-mcp"
Issues = "https://github.com/musharna/plantcv-mcp/issues"
Changelog = "https://github.com/musharna/plantcv-mcp/blob/master/CHANGELOG.md"

[project.scripts]
plantcv-mcp = "plantcv_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantcv_mcp"]

[tool.hatch.build.targets.sdist]
# Hatchling does not honour nested .gitignore files, so without an explicit
# allow-list the sdist packs .superpowers/sdd/** (task briefs, implementer
# reports, review diffs, and progress.md with internal agent IDs) plus
# docs/superpowers and .claude. Restrict to what a source distribution
# should actually carry.
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "LICENSE",
    "CITATION.cff",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    ".superpowers",
    "docs/superpowers",
    ".claude",
    "dist",
]

[tool.ruff]
# ruff formats Python code blocks embedded in Markdown. docs/ holds the design
# spec and the implementation plan, which are a historical record — reformatting
# their quoted snippets would make the record differ from what was actually
# executed. Lint and format apply to source and tests only.
extend-exclude = ["docs"]

[dependency-groups]
# ruff is declared here so CI lints with a pinned, locked version rather than
# whatever happens to be on the runner. jsonschema validates server.json against
# the registry's own published schema (vendored at tests/server.schema.json) so
# registry-side constraints fail here rather than in the publish workflow, which
# only runs once the tag is already cut.
dev = ["pytest>=8.0", "ruff>=0.6", "jsonschema>=4.0"]

# Inside THIS repository (uv sync / uv.lock) torch comes from PyTorch's CPU
# index, so the lock carries no CUDA wheels and the SAM CI job downloads ~200 MB
# rather than ~2.5 GB. This does not reach a published wheel's metadata: a user
# running `pip install "plantcv-mcp[sam]"` gets PyPI's torch for their platform.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.mutmut]
source_paths = ["src"]
# Wall/CPU limit per mutant = (estimated test time + timeout_constant) * timeout_multiplier.
# The isolation worker is a fresh spawn per mutant child (the shared one from the stats
# pass is shut down at session end on purpose; a shared pipe across 8 children crashed
# mutmut). Its first analysis runs mutmut-instrumented code and cost 41 s measured, while
# the mapped test's clean estimate was 0.19 s, so the default 1 s constant read as 375
# "timeouts" a night. 60 s covers a cold, instrumented worker.
timeout_constant = 60.0
also_copy = [".editorconfig", ".github", ".gitignore", ".mcp.json", ".pre-commit-config.yaml", ".zenodo.json", "CHANGELOG.md", "CITATION.cff", "CLAUDE.md", "CONTRIBUTING.md", "LICENSE", "NOTICE", "README.md", "SECURITY.md", "docs", "glama.json", "scripts", "server.json"]
