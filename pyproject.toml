[project]
name = "plantcv-mcp"
version = "0.3.1"
description = "MCP server exposing PlantCV as a measurement instrument — traits plus the segmentation overlay they came from"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jaret Arnold" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "plantcv",
    "phenotyping",
    "plant-science",
    "image-analysis",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    # 2.x only. The old 1.28.1 floor was a SECURITY floor rather than a feature
    # one, and every 2.x release clears it. The range MOVES rather than widening
    # to <3: this package imports mcp.server.mcpserver, which does not exist in
    # 1.x, so a range spanning both majors could resolve to a version that cannot
    # import the server. mcp 2.x requires Python >=3.10, below our >=3.11 floor.
    "mcp>=2,<3",
    # Hard pin, deliberately. Trait values can shift between PlantCV releases, and
    # determinism is a tested design goal (tests/test_determinism.py) surfaced to
    # callers by list_methods(). Loosening this would weaken a guarantee the server
    # advertises. Re-pin explicitly when validating a new PlantCV release.
    "plantcv==4.11.3",
    # No upper bound here on purpose: plantcv already caps opencv-python at <=4.12,
    # and duplicating that ceiling would silently drift when plantcv raises it.
    # NOTE: plantcv requires non-headless opencv-python, so switching this to
    # opencv-python-headless would NOT yield a headless install.
    "opencv-python>=4.9",
    "numpy>=1.26",
    # Declared explicitly rather than leaned on as a pydantic transitive: our
    # outputSchema TypedDicts MUST come from typing_extensions, because pydantic
    # raises PydanticUserError on typing.TypedDict under Python < 3.12.
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/musharna/plantcv-mcp"
Repository = "https://github.com/musharna/plantcv-mcp"
Issues = "https://github.com/musharna/plantcv-mcp/issues"
Changelog = "https://github.com/musharna/plantcv-mcp/blob/master/CHANGELOG.md"

[project.scripts]
plantcv-mcp = "plantcv_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantcv_mcp"]

[tool.hatch.build.targets.sdist]
# Hatchling does not honour nested .gitignore files, so without an explicit
# allow-list the sdist packs .superpowers/sdd/** (task briefs, implementer
# reports, review diffs, and progress.md with internal agent IDs) plus
# docs/superpowers and .claude. Restrict to what a source distribution
# should actually carry.
include = [
    "src/**",
    "tests/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CITATION.cff",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    ".superpowers",
    "docs/superpowers",
    ".claude",
    "dist",
]

[tool.ruff]
# ruff formats Python code blocks embedded in Markdown. docs/ holds the design
# spec and the implementation plan, which are a historical record — reformatting
# their quoted snippets would make the record differ from what was actually
# executed. Lint and format apply to source and tests only.
extend-exclude = ["docs"]

[dependency-groups]
# ruff is declared here so CI lints with a pinned, locked version rather than
# whatever happens to be on the runner.
dev = ["pytest>=8.0", "ruff>=0.6"]
