name: Feature request
description: Suggest an improvement to plantcv-mcp
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server wraps PlantCV. Please say whether you want a new PlantCV capability exposed, or a change to how this server guards/reports an existing one.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the analysis you are trying to run and where the server gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should the tool accept or return? A sketch of the call and response helps.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What are you doing instead today?
    validations:
      required: false
