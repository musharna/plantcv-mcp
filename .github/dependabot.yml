version: 2
# Nothing proposed dependency updates in this repo before now, so pins could drift
# silently and a deprecation deadline would arrive unwarned.
#
# `uv`, not `pip`: this project is uv-locked. Dependabot's uv ecosystem (GA March
# 2025) reads pyproject.toml and uv.lock together; the pip ecosystem would update
# pyproject and leave uv.lock stale, which CI installs with --frozen and would fail.
#
# Minor/patch are grouped to keep PR volume low. Majors arrive individually -- those
# carry the runtime bumps and deserve their own CI run. These are proposals for a
# human to judge, NOT auto-merge candidates: a dependabot PR on a sibling repo once
# proposed widening an intentionally-narrow major bound and would have broken the
# build.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Both of these are pinned on purpose, and saying so here is the difference
      # between a clean job and a failing one: the first uv run reported
      # `update_not_possible` for opencv-python and failed the job.
      #
      # plantcv is HARD-PINNED at 4.11.3 because trait values can shift between
      # releases and determinism is a tested, advertised guarantee (see the
      # comment on the pin in pyproject.toml). Moving it is an act of validation,
      # not a dependency bump, so it must not arrive as an automated PR.
      - dependency-name: "plantcv"
      # opencv-python is bounded by plantcv itself (<=4.12), deliberately not
      # re-capped here. Dependabot cannot raise it without moving plantcv, so
      # every proposal is unsatisfiable by construction.
      - dependency-name: "opencv-python"
